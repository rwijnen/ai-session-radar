name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A PR that changes the app must be a release, or merging it publishes nothing: the Release
  # workflow only acts on a version that has no tag yet. Docs, tests and CI changes are exempt.
  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The whole history and the tags: it diffs against the base branch and refuses a
      # version that is already tagged.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the PR bumps the version when it changes the app
        env:
          BASE: origin/${{ github.base_ref }}
        run: .github/scripts/check-version-bump.sh "$BASE"

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swift --version
          python3 --version

      # Hermetic: temporary folders for all state, a fake `gh` for the pull requests,
      # never the runner's ~/.claude.
      - name: Python tests (hooks, sessions, pull requests, installer)
        run: python3 -m unittest discover -s tests -v

      - name: Swift tests (updater)
        run: swift test

      - name: Build the app
        run: ./build.sh
